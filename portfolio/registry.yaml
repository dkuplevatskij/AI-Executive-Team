# Реестр продуктов портфеля.
# Единственный перечень продуктов, с которым работает команда. Добавление продукта — только
# через /new-product-onboarding (портфель не привязан к числу продуктов: новый продукт = новая
# запись и новая папка portfolio/<id>/, агенты и правила не меняются).
#
# Поля:
#   id       — латиница, совпадает с именем папки portfolio/<id>/
#   status   — Development / Beta / Production / Paused / Archived (статусы ТЗ)
#   launched — запущен ли продукт для пользователей (true/false), по решению собственника D-001
#   repo     — owner/name на GitHub;  local — имя папки клона в облачной сессии (/home/user/<local>)
#   url      — боевой адрес, если есть
#   card     — карточка продукта;  pm — ответственный агент
#   source   — на чём основан статус

